(function loop(ms){const t=RM?2:ms/1000;cvs.forEach(c=>vis.has(c)&&paint(c,c.dataset.m,t));if(cur)paint(mc,cur,t);if(!RM||!loop.once){loop.once=1;requestAnimationFrame(loop)}})(0);

/* contact */
const f=document.getElementById('cf'),st=document.getElementById('st'),sb=document.getElementById('sb');
f.onsubmit=async e=>{e.preventDefault();if(sb.disabled)return;const d=Object.fromEntries(new FormData(f));st.className='';
if(!d.name.trim()||!d.subject.trim()||!d.message.trim()||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)){st.className='er';st.textContent='Please complete all fields with a valid email.';return}
sb.disabled=true;sb.textContent='Transmitting…';st.textContent='';
try{const r=await fetch(f.dataset.endpoint||'/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let j={};try{j=await r.json()}catch{}
if(r.ok&&j.ok){st.className='ok';st.textContent='Message delivered. Thank you — I will reply soon.';f.reset()}else{st.className='er';st.textContent=j.error||'Transmission failed (server error '+r.status+'). Please email directly.'}}
catch{st.className='er';st.textContent='Could not reach the mail service. Please email '+((window.portfolioConfig.personal||{}).email||'me')+' directly.'}
sb.disabled=false;sb.textContent=sb.dataset.l};

/* hero 3D */
(()=>{const cv=document.getElementById('stage');if(!window.THREE){return}
const r=new THREE.WebGLRenderer({canvas:cv,antialias:!MOB,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,MOB?1.5:2));const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,200);cam.position.set(0,0,12);
sc.add(new THREE.AmbientLight(0x6688cc,.7));const L=new THREE.DirectionalLight(0xffffff,1.4);L.position.set(5,4,6);sc.add(L);
const n=MOB?500:1400,pos=new Float32Array(n*3);for(let i=0;i<n*3;i++)pos[i]=(Math.random()-.5)*120;const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(pos,3));const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xcfe3ff,size:.15,transparent:true,opacity:.8}));sc.add(stars);
const earth=new THREE.Mesh(new THREE.SphereGeometry(9,48,48),new THREE.MeshPhongMaterial({color:0x0b2a5c,emissive:0x04122b,shininess:18}));earth.position.set(-1,-12.5,-8);sc.add(earth);
const wf=new THREE.Mesh(new THREE.SphereGeometry(9.02,24,16),new THREE.MeshBasicMaterial({color:0x00e5ff,wireframe:true,transparent:true,opacity:.08}));wf.position.copy(earth.position);sc.add(wf);
const atm=new THREE.Mesh(new THREE.SphereGeometry(9.5,48,48),new THREE.MeshBasicMaterial({color:0x397bff,transparent:true,opacity:.12,side:THREE.BackSide}));atm.position.copy(earth.position);sc.add(atm);
const sat=new THREE.Group(),M=(c,e)=>new THREE.MeshStandardMaterial({color:c,metalness:.8,roughness:.35,emissive:e||0});
sat.add(new THREE.Mesh(new THREE.BoxGeometry(1,1,1.4),M(0xc9d3e6)));const gold=new THREE.Mesh(new THREE.BoxGeometry(1.05,.2,1.45),M(0xd9a441));gold.position.y=.4;sat.add(gold);
const panels=[];[-1,1].forEach(s=>{const arm=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.8),M(0x888));arm.rotation.z=Math.PI/2;arm.position.x=s*.9;sat.add(arm);const pv=new THREE.Group();const p=new THREE.Mesh(new THREE.BoxGeometry(2.2,.04,1.2),M(0x16306b,0x0a1a40));p.position.x=s*1.1;pv.add(p);const gr=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2.2,.05,1.2)),new THREE.LineBasicMaterial({color:0x00e5ff}));gr.position.x=s*1.1;pv.add(gr);pv.position.x=s*.9;sat.add(pv);panels.push(pv)});
const dish=new THREE.Mesh(new THREE.ConeGeometry(.5,.35,24,1,true),M(0xeeeeee));dish.position.set(0,.2,.95);dish.rotation.x=-Math.PI/2;dish.material.side=THREE.DoubleSide;sat.add(dish);
sat.scale.setScalar(MOB?.8:1);sat.position.set(MOB?0:3,MOB?2.3:.6,0);sc.add(sat);
const rings=[0,1,2].map(i=>{const m=new THREE.Mesh(new THREE.RingGeometry(.9,.95,48),new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,side:THREE.DoubleSide}));m.position.copy(sat.position);sc.add(m);return m});
const orb=[[5.2,.4,.2],[7.4,-.3,.6]].map(([R,x,y])=>{const o=new THREE.Mesh(new THREE.TorusGeometry(R,.012,6,128),new THREE.MeshBasicMaterial({color:0x397bff,transparent:true,opacity:.35}));o.rotation.set(1.2+x,y,0);o.position.copy(sat.position);sc.add(o);return o});
let mx=0,my=0;addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
function rs(){const h=document.getElementById('hero');r.setSize(h.clientWidth,h.clientHeight,false);cam.aspect=h.clientWidth/h.clientHeight;cam.updateProjectionMatrix()}rs();addEventListener('resize',rs);
let on=true;new IntersectionObserver(e=>on=e[0].isIntersecting).observe(cv);const tel=document.getElementById('tel');let T=0;
function a(){requestAnimationFrame(a);if(!on)return;const k=RM?0:1;T+=.016*k;sat.rotation.y+=.004*k;sat.rotation.z=Math.sin(T*.5)*.15;panels.forEach((p,i)=>p.rotation.x=Math.sin(T*.6)*.25);earth.rotation.y+=.0006*k;wf.rotation.y=earth.rotation.y;stars.rotation.y+=.0002*k;
orb.forEach((o,i)=>o.rotation.z+=(i?-.002:.002)*k);rings.forEach((m,i)=>{const u=((T*.5)+i/3)%1;m.scale.setScalar(1+u*4);m.material.opacity=(1-u)*.5;m.lookAt(cam.position)});
cam.position.x+=(mx*2-cam.position.x)*.05;cam.position.y+=(-my*1.2-cam.position.y)*.05;cam.lookAt(0,0,0);
if(!(T*60|0)%6)tel.textContent='AZ '+((T*20)%360).toFixed(1).padStart(5,'0')+'° · EL '+(30+Math.sin(T)*25).toFixed(1)+'°';r.render(sc,cam)}a()})();
